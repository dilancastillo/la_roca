<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 1350" width="1082" height="1350">
  <defs>
    <pattern id="point-zipper-hatch" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="16" y2="16" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="0" y2="16" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round"/>
    </pattern>
    <clipPath id="point-zipper-clip">
      <rect x="30" y="30" width="320" height="75"/>
    </clipPath>
  </defs>
  <g id="chest-pocket-point-zipper" transform="translate(600 390) scale(.45)">
    <path
      d="M30,30 H350 V360 L190,430 L30,360 Z"
      fill="#ffffff"
      stroke="#1d1d1b"
      stroke-width="6"
      stroke-linejoin="miter"
    />
    <rect
      x="30"
      y="30"
      width="320"
      height="75"
      fill="url(#point-zipper-hatch)"
      clip-path="url(#point-zipper-clip)"
    />
    <line x1="30" y1="105" x2="350" y2="105" stroke="#1d1d1b" stroke-width="6"/>
  </g>
</svg>
