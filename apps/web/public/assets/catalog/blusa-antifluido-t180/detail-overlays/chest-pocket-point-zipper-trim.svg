<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 1350" width="1082" height="1350">
  <defs>
    <pattern id="point-zipper-trim-hatch" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="16" y2="16" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="0" y2="16" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round"/>
    </pattern>
    <clipPath id="point-zipper-trim-clip">
      <rect x="30" y="30" width="320" height="75"/>
    </clipPath>
  </defs>
  <g id="chest-pocket-point-zipper-trim" transform="translate(600 390) scale(.45)">
    <rect
      x="30"
      y="30"
      width="320"
      height="75"
      fill="url(#point-zipper-trim-hatch)"
      clip-path="url(#point-zipper-trim-clip)"
    />
  </g>
</svg>
